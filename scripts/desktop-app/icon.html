<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#0d2a3d"/>
      <stop offset="1" stop-color="#03080e"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#bff3ff"/>
      <stop offset="0.7" stop-color="#3cc8ff"/>
      <stop offset="1" stop-color="#3cc8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square inset on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="#5fd8ff">
    <circle cx="512" cy="512" r="300" stroke-width="10" stroke-opacity="0.55"/>
    <circle cx="512" cy="512" r="262" stroke-width="26" stroke-dasharray="58 20" stroke-opacity="0.9"/>
    <circle cx="512" cy="512" r="210" stroke-width="6" stroke-opacity="0.7"/>
    <polygon points="512,360 644,588 380,588" stroke-width="22" stroke-linejoin="round" stroke="#bff3ff"/>
  </g>
  <circle cx="512" cy="512" r="120" fill="url(#core)"/>
</svg>
</body>
</html>
